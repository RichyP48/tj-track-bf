version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tj-track-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tjtrack_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./tj-track
    container_name: tj-track-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build: ./track-front
    container_name: tj-track-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api/v1.0

volumes:
  mysql_data: